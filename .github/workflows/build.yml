# Tests, then single-file vbios-loader.exe (command line) and vbios-loader-gui.exe (window).
# A tag vX.Y.Z publishes a release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: if ("${{ github.ref_name }}" -ne "v0.4.0") { throw "tag ${{ github.ref_name }} is not v0.4.0" }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install Nuitka
        run: python -m pip install nuitka==4.2.2 ordered-set==4.1.0 zstandard==0.23.0
      - name: Build vbios-loader.exe
        run: >-
          python -m nuitka --onefile --assume-yes-for-downloads --msvc=latest
          --windows-console-mode=force --python-flag=no_site --python-flag=isolated
          --nofollow-import-to=unittest --nofollow-import-to=pydoc --nofollow-import-to=tests
          --include-package=nvidia_vbios.windows_loader
          --nofollow-import-to=nvidia_vbios.windows_loader.gui --nofollow-import-to=tkinter
          --product-name="Windows VBIOS Vix Loader" --company-name="Vix Loader authors"
          --file-description="Windows VBIOS Vix Loader" --copyright="Copyright (c) 2026 panchovix"
          --file-version=0.4.0 --product-version=0.4.0
          --output-dir=build --output-filename=vbios-loader.exe tools/entry.py
      - name: Build vbios-loader-gui.exe
        run: >-
          python -m nuitka --onefile --assume-yes-for-downloads --msvc=latest
          --windows-console-mode=disable --windows-uac-admin --enable-plugin=tk-inter
          --python-flag=no_site --python-flag=isolated
          --nofollow-import-to=unittest --nofollow-import-to=pydoc --nofollow-import-to=tests
          --include-package=nvidia_vbios.windows_loader
          --product-name="Windows VBIOS Vix Loader" --company-name="Vix Loader authors"
          --file-description="Windows VBIOS Vix Loader (window)" --copyright="Copyright (c) 2026 panchovix"
          --file-version=0.4.0 --product-version=0.4.0
          --output-dir=build --output-filename=vbios-loader-gui.exe tools/entry_gui.py
      - name: Smoke test (no NVIDIA GPU on the runner)
        run: |
          $out = (& build/vbios-loader.exe status --json | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "status exited with code $LASTEXITCODE" }
          if ($out -ne '[]') { throw "unexpected status output: $out" }
          & build/vbios-loader.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited with code $LASTEXITCODE" }
      - name: Window smoke test (screenshot)
        # The runner's shell is already elevated. The redirection makes Start-Process use CreateProcess, so the
        # exe inherits the environment, and a non-elevated shell fails at once (error 740) instead of prompting.
        # In smoke mode the window reads the status, writes nothing and exits 0.
        run: |
          $env:VBIOS_LOADER_GUI_SMOKE = '1'
          $p = Start-Process -FilePath (Resolve-Path build/vbios-loader-gui.exe).Path -PassThru `
              -RedirectStandardOutput gui-out.txt -RedirectStandardError gui-err.txt
          $null = $p.Handle
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\gui-smoke.png")
          $exited = $p.WaitForExit(60000)
          if (-not $exited) { Stop-Process -Id $p.Id -Force }
          Get-Content gui-out.txt, gui-err.txt -ErrorAction SilentlyContinue
          if (-not $exited) { throw "vbios-loader-gui.exe did not exit" }
          if ($p.ExitCode -ne 0) { throw "vbios-loader-gui.exe exited with code $($p.ExitCode)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: gui-smoke
          path: gui-*
          if-no-files-found: ignore
      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/vbios-loader.exe, build/vbios-loader-gui.exe dist/
          python tools/notices.py notices
          if ($LASTEXITCODE -ne 0) { throw "license notices failed" }
          Compress-Archive -Path notices/* -DestinationPath dist/third-party-notices.zip
          $sums = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", ($sums -join "`n") + "`n")
          Get-Content dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: vbios-loader-windows
          path: dist/*
          if-no-files-found: error
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: vbios-loader-windows
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}"
          dist/vbios-loader.exe dist/vbios-loader-gui.exe dist/SHA256SUMS dist/third-party-notices.zip
          --title "${{ github.ref_name }}" --notes "Windows build. See README.md. Not affiliated with NVIDIA."
